# The Angular app plus a reverse proxy for the API paths (mirrors frontend/proxy.conf.json).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20g;  # episode uploads

    # `/settings` itself is an Angular route; only the API's `/settings/llm` is proxied.
    location ~ ^/((auth|uploads|jobs|clips|ctr-candidates|insights|youtube)(/|$)|settings/llm) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;  # stream large uploads straight to the API
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
