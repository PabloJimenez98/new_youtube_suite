[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Opt-in suites: `pytest -m gpu` (docs/decisions/0016) and
# `pytest -m youtube_oauth` (real connected channel, 0017) and
# `pytest -m youtube_reporting -s` (real Reporting API job, two phases, 0018).
addopts = -m "not gpu and not youtube_oauth and not youtube_reporting"
markers =
    youtube_api: hits the real YouTube Data API v3 (needs YOUTUBE_API_KEY; spends < 10 units)
    youtube_oauth: hits real Google OAuth + Analytics API v2 with the channel connected in the dev DB (M11)
    youtube_reporting: creates/adopts the real Reporting API reach job for the connected channel; phase 2 needs >= 48 h after job creation (M12)
    gpu: needs the CUDA GPU and the production models/config; opt-in with -m gpu
