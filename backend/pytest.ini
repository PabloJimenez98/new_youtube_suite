[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Opt-in suites: `pytest -m gpu` (docs/decisions/0016) and
# `pytest -m youtube_oauth` (real connected channel, 0017).
addopts = -m "not gpu and not youtube_oauth"
markers =
    youtube_api: hits the real YouTube Data API v3 (needs YOUTUBE_API_KEY; spends < 10 units)
    youtube_oauth: hits real Google OAuth + Analytics API v2 with the channel connected in the dev DB (M11)
    gpu: needs the CUDA GPU and the production models/config; opt-in with -m gpu
