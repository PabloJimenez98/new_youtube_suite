<div class="stat-tile glass-panel" [class.stat-tile--preview]="preview()">
  <div class="stat-tile__head">
    <span class="stat-tile__label">{{ label() }}</span>
    @if (preview()) {
      <app-preview-badge />
    }
  </div>
  <span class="stat-tile__value">{{ value() }}</span>
  @if (hint()) {
    <span class="stat-tile__hint">{{ hint() }}</span>
  }
</div>
