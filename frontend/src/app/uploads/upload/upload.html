<div class="upload">
  <h2>Upload an episode</h2>

  <input
    type="file"
    accept="video/*"
    [disabled]="state() === 'uploading'"
    (change)="onFileSelected($event)"
  />

  @switch (state()) {
    @case ('uploading') {
      <progress [value]="progress()" max="100"></progress>
      <span>{{ progress() }}%</span>
    }
    @case ('success') {
      <p class="upload__success">Upload complete.</p>
    }
    @case ('error') {
      <p class="upload__error" role="alert">{{ errorMessage() }}</p>
    }
  }

  <button
    type="button"
    [disabled]="!selectedFile || state() === 'uploading'"
    (click)="submit()"
  >
    Upload
  </button>
</div>
