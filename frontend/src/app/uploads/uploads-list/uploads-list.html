<div class="uploads-list">
  <h2>Uploads</h2>

  @if (loading()) {
    <p>Loading…</p>
  } @else if (errorMessage()) {
    <p class="uploads-list__error" role="alert">{{ errorMessage() }}</p>
  } @else if (items().length === 0) {
    <p>No uploads yet.</p>
  } @else {
    <ul>
      @for (item of items(); track item.id) {
        <li>
          <span class="uploads-list__filename">{{ item.filename }}</span>
          <span class="uploads-list__status">{{ item.status }}</span>
          <span class="uploads-list__date">{{ item.uploaded_at | date: 'medium' }}</span>
        </li>
      }
    </ul>
  }
</div>
