<div class="video-row glass-panel">
  <div class="video-row__info">
    <span class="video-row__filename">{{ upload().filename }}</span>
    <span class="badge" [class]="'badge--' + upload().status">{{ upload().status }}</span>
  </div>

  <div class="video-row__tools">
    @for (tool of toolTypes; track tool) {
      <div class="video-row__tool">
        <span class="video-row__tool-label">{{ toolLabels[tool] }}</span>
        @if (latestJobFor(tool); as job) {
          <app-job-status-badge [status]="job.status" />
        } @else {
          <button
            type="button"
            class="btn btn--ghost video-row__run"
            [disabled]="runningToolType() === tool"
            (click)="runTool(tool)"
          >
            {{ runningToolType() === tool ? 'Starting…' : 'Run' }}
          </button>
        }
      </div>
    }
  </div>

  <button
    type="button"
    class="btn btn--danger video-row__delete"
    (click)="deleteRequested.emit(upload())"
  >
    Delete
  </button>
</div>
